<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体育生命树 · 3D 模拟演示</title>
  <link rel="stylesheet" href="life-tree-3d.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #eff4ef; color: #23342b; font-family: system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; }
    h1 { font-size: 24px; margin: 12px 0; }
    p { line-height: 1.7; }
    a { color: #386447; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 16px; background: #e6ddeb; color: #673675; font-size: 12px; }
    .three-d-card { margin-top: 16px; }
    @media(max-width: 620px) { body { padding: 12px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← 返回体育经历问卷</a>
    <h1>体育生命树 · 3D 模拟演示</h1>
    <span class="badge">模拟经历，仅供展示，不是研究数据</span>
    <p>采用博导原版三维查看器，展示比赛获奖与运动伤病两条模拟轨迹。本页不读取或修改问卷草稿。</p>
    <section class="three-d-card" aria-label="体育经历三维演示">
      <h3>比赛、训练与成长的轨迹</h3>
      <p>拖动旋转、滚轮或双指缩放；点击轨迹按钮查看经历与情境。</p>
      <div id="tree"></div>
    </section>
  </main>
  <script src="life-tree.js"></script>
  <script src="life-tree-3d.js"></script>
  <script>
    const events = [
      { id: 'demo-award', label: '在体育比赛中获得奖项（模拟）', domain: '比赛、选拔与机会', valence: 1,
        trajectory_version: 3, trajectory_age_now: 20, age_start: 15, age_end: 20,
        r_then: .82, r_now: .55, centrality: .65, now_salience: .55,
        path_ar: [[15,.82],[16,.7],[17,.48],[18,.58],[19,.62],[20,.55]] },
      { id: 'demo-injury', label: '伤病打断训练后逐步康复（模拟）', domain: '训练、身体与学业', valence: -1,
        trajectory_version: 3, trajectory_age_now: 20, age_start: 17, age_end: 20,
        r_then: .8, r_now: .18, centrality: .45, now_salience: .18,
        path_ar: [[17,-.8],[17.5,-.9],[18,-.68],[18.5,-.4],[19,-.28],[20,-.18]] }
    ];
    const details = {
      'demo-award': { where: '学校比赛场馆', who: ['教练','队友'], why: '自己的努力与团队支持', how: '持续训练并得到鼓励', closeness: .85 },
      'demo-injury': { where: '专项训练场', who: ['教练','队友','家人'], why: '运动伤病', how: '获得支持并逐步康复', closeness: .75 }
    };
    LifeTree3D.render({ host: document.getElementById('tree'), events, details, age: 20 });
  </script>
</body>
</html>
